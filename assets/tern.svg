<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F22"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <!-- one gradient across the whole bird so the facets read as a single form -->
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="176" y1="276" x2="848" y2="778">
      <stop offset="0" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- bird bbox centred on (512, 506): optical centre sits a touch above the middle -->
  <g transform="translate(0,-21)">
    <polygon points="512,372 176,290 476,452" fill="url(#t)" fill-opacity="0.62"/>
    <polygon points="512,372 848,290 548,452" fill="url(#t)"/>
    <polygon points="512,330 548,452 512,620 476,452" fill="url(#t)" fill-opacity="0.88"/>
    <polygon points="512,620 436,792 512,680" fill="url(#t)" fill-opacity="0.58"/>
    <polygon points="512,620 588,792 512,680" fill="url(#t)" fill-opacity="0.9"/>
  </g>
</svg>
