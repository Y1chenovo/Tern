name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tern-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tern-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tern-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tern-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI & D-Bus system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI binary
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Stage CLI binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tern.exe" "dist/tern-cli.exe"
          else
            cp "target/${{ matrix.target }}/release/tern" "dist/tern-cli"
          fi

      - name: Build GUI binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          cp LICENSE README.md dist/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tern.exe" "dist/tern.exe"
            (cd dist && 7z a -tzip "../${{ matrix.artifact }}.zip" tern.exe tern-cli.exe LICENSE README.md)
            sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            cp "target/${{ matrix.target }}/release/tern" "dist/tern"
            chmod +x dist/tern dist/tern-cli
            tar -C dist -czf "${{ matrix.artifact }}.tar.gz" tern tern-cli LICENSE README.md
            shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip*
            ${{ matrix.artifact }}.tar.gz*

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
